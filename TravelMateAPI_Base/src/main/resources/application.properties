spring.application.name=TravelMateAPI_Base
server.port=${SERVER_PORT:8080}

# ===============================
# MYSQL: CATALOGO Y MEMORIA
# ===============================

spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3307/travelmate?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===============================
# POSTGRESQL: ALMACEN vECTORIAL
# ===============================
travelmate.ai.datasource.url=${PGVECTOR_URL:jdbc:postgresql://localhost:5432/travelmate_ai}
travelmate.ai.datasource.username=${PGVECTOR_USER}
travelmate.ai.datasource.password=${PGVECTOR_PASSWORD}
travelmate.ai.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# OPENROUTER
# ===============================
spring.ai.model.chat=openai
spring.ai.model.embedding=openai

spring.ai.openai.base-url=https://openrouter.ai/api/v1
spring.ai.openai.api-key=${OPENROUTER_API_KEY}

spring.ai.openai.chat.model=${OPENROUTER_CHAT_MODEL:openrouter/free}
spring.ai.openai.embedding.model=${OPENROUTER_EMBEDDING_MODEL:nvidia/nemotron-3-embed-1b:free}
spring.ai.openai.embedding.encoding-format=float

# Tiempo maximo de cada solicitud al proveedor
spring.ai.openai.timeout=${OPENROUTER_TIMEOUT:60s}

# Evitar reintentos acumulados entre el SDK y Spring AI
spring.ai.openai.max-retries=0
spring.ai.retry.max-attempts=1

# ===============================
# MEMORIA JDBC EN MYSQL
# ===============================
spring.ai.chat.memory.repository.jdbc.initialize-schema=always
spring.ai.chat.memory.repository.jdbc.schema=classpath:org/springframework/ai/chat/memory/repository/jdbc/schema-mysql.sql

# ===============================
# PGVECTOR
# ===============================
travelmate.ai.vectorstore.dimensions=2048
travelmate.ai.vectorstore.index-type=NONE
travelmate.ai.vectorstore.initialize-schema=true
travelmate.ai.vectorstore.remove-existing-vector-store-table=false
travelmate.ai.vectorstore.schema-name=public
travelmate.ai.vectorstore.table-name=vector_store

# ===============================
# LIMITES DEL ASISTENTE
# ===============================
travelmate.ai.assistant.memory-window=6
travelmate.ai.assistant.max-message-length=2000
travelmate.ai.assistant.retrieval-top-k=5
travelmate.ai.assistant.max-recommendations=3

# ==============================
# RECONSTRUCCIÓN DEL INDICE EN DESARROLLO
# ==============================
travelmate.ai.index.admin-secret=${AI_INDEX_ADMIN_SECRET:}
